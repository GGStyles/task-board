<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Board</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#17232f;--mute:#5d6b78;--line:#d5dde4;--acc:#0f766e;--accInk:#fff;--hi:#c2410c;--med:#a16207;--lo:#4b6b8a;--over:#b91c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--panel:#17232f;--ink:#e6edf3;--mute:#93a3b1;--line:#2b3a48;--acc:#2dd4bf;--accInk:#06201d;--hi:#fb923c;--med:#facc15;--lo:#7fa6cc;--over:#f87171}}
:root[data-theme="dark"]{--bg:#0f1720;--panel:#17232f;--ink:#e6edf3;--mute:#93a3b1;--line:#2b3a48;--acc:#2dd4bf;--accInk:#06201d;--hi:#fb923c;--med:#facc15;--lo:#7fa6cc;--over:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
h1{font-size:28px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.add{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-bottom:16px}
.add input,.add select,.tools input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.btn{background:var(--acc);color:var(--accInk);border:0;border-radius:6px;padding:10px 16px;font-weight:600}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--mute);font-size:14px}
.ghost:hover{color:var(--ink);border-color:var(--mute)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{flex:1;min-width:140px}
.tools .ghost[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--lo);border-radius:6px;padding:12px}
li.p-high{border-left-color:var(--hi)}li.p-med{border-left-color:var(--med)}
.row{display:flex;gap:12px;align-items:flex-start}
.row input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--acc);flex:none}
.main{flex:1;min-width:0}
.t{word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--mute)}
.meta{font-size:13px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.over{color:var(--over);font-weight:600}
.acts{display:flex;gap:6px;flex:none}
.note{margin-top:10px;width:100%;min-height:90px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
.empty{text-align:center;color:var(--mute);padding:32px 0;border:1px dashed var(--line);border-radius:6px}
@media (max-width:520px){.add{grid-template-columns:1fr 1fr}.add input[type=text]{grid-column:1/-1}.add .btn{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Task Board</h1><div class="sub" id="count"></div></div>
    <button class="ghost" id="theme" aria-label="Toggle dark mode">Theme</button>
  </header>
  <div class="bar" role="progressbar" aria-label="Completion" id="barwrap"><i id="bar"></i></div>
  <div class="add">
    <input type="text" id="title" placeholder="What needs doing?" aria-label="Task title">
    <select id="prio" aria-label="Priority"><option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option></select>
    <input type="date" id="due" aria-label="Due date">
    <button class="btn" id="addBtn">Add task</button>
  </div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search tasks and notes" aria-label="Search">
    <button class="ghost" data-f="all" aria-pressed="true">All</button>
    <button class="ghost" data-f="active" aria-pressed="false">Active</button>
    <button class="ghost" data-f="done" aria-pressed="false">Done</button>
    <button class="ghost" id="clear">Clear done</button>
  </div>
  <ul id="list"></ul>
</main>
<script>
(function(){
  var KEY='taskboard.v1', tasks=[], filter='all', open={};
  try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var rank={high:0,med:1,low:2}, label={high:'High',med:'Medium',low:'Low'};
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function add(){
    var t=$('title').value.trim(); if(!t){$('title').focus();return}
    tasks.unshift({id:Date.now()+Math.random(),title:t,prio:$('prio').value,due:$('due').value,note:'',done:false});
    $('title').value='';$('due').value='';save();render();$('title').focus();
  }
  function render(){
    var q=$('q').value.toLowerCase(), t0=today();
    var vis=tasks.filter(function(t){
      if(filter==='active'&&t.done)return false; if(filter==='done'&&!t.done)return false;
      return !q||(t.title+' '+t.note).toLowerCase().indexOf(q)>-1;
    }).sort(function(a,b){
      if(a.done!==b.done)return a.done?1:-1;
      if(rank[a.prio]!==rank[b.prio])return rank[a.prio]-rank[b.prio];
      return (a.due||'9999').localeCompare(b.due||'9999');
    });
    var done=tasks.filter(function(t){return t.done}).length, pct=tasks.length?Math.round(done/tasks.length*100):0;
    $('bar').style.width=pct+'%'; $('barwrap').setAttribute('aria-valuenow',pct);
    $('count').textContent=tasks.length?done+' of '+tasks.length+' done ('+pct+'%)':'No tasks yet';
    if(!vis.length){$('list').innerHTML='<li class="empty" style="border-left-width:1px">'+(tasks.length?'No tasks match this view.':'Add your first task above.')+'</li>';return}
    $('list').innerHTML=vis.map(function(t){
      var over=t.due&&!t.done&&t.due<t0, dueTxt=t.due?(over?'Overdue: ':'Due ')+t.due:'No due date';
      return '<li class="p-'+t.prio+(t.done?' done':'')+'" data-id="'+t.id+'"><div class="row">'+
      '<input type="checkbox" data-a="toggle" '+(t.done?'checked':'')+' aria-label="Mark done">'+
      '<div class="main"><div class="t">'+esc(t.title)+'</div><div class="meta"><span>'+label[t.prio]+' priority</span><span class="'+(over?'over':'')+'">'+dueTxt+'</span>'+(t.note?'<span>Has notes</span>':'')+'</div></div>'+
      '<div class="acts"><button class="ghost" data-a="note" aria-expanded="'+!!open[t.id]+'">Notes</button><button class="ghost" data-a="del" aria-label="Delete task">Delete</button></div></div>'+
      (open[t.id]?'<textarea class="note" data-a="edit" placeholder="Add details, links, next steps..." aria-label="Notes">'+esc(t.note)+'</textarea>':'')+'</li>';
    }).join('');
  }
  $('list').addEventListener('click',function(e){
    var a=e.target.dataset.a, li=e.target.closest('li'); if(!a||!li)return;
    var id=li.dataset.id, t=tasks.filter(function(x){return String(x.id)===id})[0]; if(!t)return;
    if(a==='toggle'){t.done=!t.done;save();render()}
    else if(a==='del'){tasks=tasks.filter(function(x){return x!==t});delete open[t.id];save();render()}
    else if(a==='note'){open[t.id]=!open[t.id];render();var n=document.querySelector('li[data-id="'+id+'"] textarea');if(n)n.focus()}
  });
  $('list').addEventListener('input',function(e){
    if(e.target.dataset.a!=='edit')return;
    var id=e.target.closest('li').dataset.id;
    tasks.forEach(function(x){if(String(x.id)===id)x.note=e.target.value});save();
  });
  $('list').addEventListener('focusout',function(e){if(e.target.dataset.a==='edit')render()});
  $('addBtn').onclick=add;
  $('title').addEventListener('keydown',function(e){if(e.key==='Enter')add()});
  $('q').addEventListener('input',render);
  $('clear').onclick=function(){tasks=tasks.filter(function(t){return !t.done});save();render()};
  document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){
    filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});render()}});
  $('theme').onclick=function(){
    var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    r.dataset.theme=dark?'light':'dark';
  };
  render();
})();
</script>
</body>
</html>
